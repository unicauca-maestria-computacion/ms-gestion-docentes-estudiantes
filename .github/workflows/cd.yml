name: CD Practica Profesional ms-gestion-docentes-estudiantes

on:
  workflow_run:
    workflows: ['CI Practica Profesional ms-gestion-docentes-estudiantes']
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Pull and Recreate Container
        run: |
          cd /home/daniel/practica-profesional
          docker compose pull ms-gestion-docentes-estudiantes
          docker compose up -d ms-gestion-docentes-estudiantes
          docker images --filter "dangling=true" --filter "reference=*practica-profesional-gestion-docentes-estudiantes*" -q | xargs -r docker rmi -f 2>/dev/null || true

